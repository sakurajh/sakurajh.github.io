---
layout: default
---
<section class="wrap page-block">
  <header class="page-head">
    {% if page.kicker %}<span class="kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-content markdown-body">
    {{ content }}
  </div>
</section>
