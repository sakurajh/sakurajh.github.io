---
layout: default
---
<section class="hero">
  <div class="wrap hero-inner">
    <div class="hero-avatar">
      <img src="{{ site.avatar | relative_url }}" alt="{{ site.author }}" width="96" height="96">
    </div>
    <div class="hero-text">
      <h1>嗨，我是{{ site.nickname }} <span class="wave">👋</span></h1>
      <p class="hero-bio">{{ site.bio }}</p>
      <p class="hero-stats">
        <span>{{ site.posts.size }} 篇文章</span>
        <span>{{ site.categories.size }} 个分类</span>
        <span>从 {{ site.since }} 年开始记录</span>
      </p>
      <div class="hero-links">
        <a class="pill" href="{{ site.social.github }}" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          GitHub
        </a>
        <a class="pill" href="{{ site.social.email }}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
          邮箱
        </a>
        <a class="pill" href="{{ site.social.csdn }}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M4 12h13M4 18h7"/></svg>
          CSDN
        </a>
        <a class="pill" href="{{ '/projects.html' | relative_url }}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3z"/></svg>
          我的项目
        </a>
      </div>
    </div>
  </div>
</section>

<section class="wrap section">
  <div class="section-head">
    <h2>最新文章</h2>
    <a class="more" href="{{ '/categories.html' | relative_url }}">全部文章 →</a>
  </div>

  <div class="post-grid">
    {% for post in paginator.posts %}
      {% include post-card.html post=post %}
    {% endfor %}
  </div>

  {% include pager.html %}
</section>
