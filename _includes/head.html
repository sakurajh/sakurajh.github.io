<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta name="author" content="{{ site.author }}">
<meta name="keywords" content="{{ site.keyword }}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="msvalidate.01" content="0995FA03D5E63FFCF82A3C349B8F10E4">
<meta name="baidu-site-verification" content="codeva-vomKlSGAH9">

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{% endif %}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if page.layout == 'home' or page.url == '/' %}
<link rel="preload" as="image" href="{{ site.avatar | relative_url }}">
{% endif %}

<script>
  /* 在渲染前确定主题，避免刷新闪烁 */
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (!saved) {
        saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  })();
</script>
