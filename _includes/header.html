<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
      <span class="brand-mark">赵</span>
      <span class="brand-text">
        <b>{{ site.author }}</b>
        <em>sakurajh.dev</em>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="主导航">
      {% for item in site.nav %}
        <a class="nav-link" href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="搜索文章" title="搜索 ( / )">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="切换深浅色" title="切换深浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>
      </button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
