# ============================================================
# 博客 Nginx 配置（国内镜像站）
# 放到 /etc/nginx/sites-available/blog.conf 然后软链到 sites-enabled
# 把 www.example.com 换成你备案通过的域名
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;

    # 首次部署先用 HTTP 跑起来，证书申请后由 certbot 自动改写成 301
    root /var/www/blog;
    index index.html;

    charset utf-8;

    # 日志
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 静态资源长缓存（文件名不带 hash，用 7 天折中）
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # HTML 不缓存，保证发版后立即生效
    location ~* \.(html|xml|txt|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 自定义 404
    error_page 404 /404.html;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 隐藏 nginx 版本
    server_tokens off;
}
