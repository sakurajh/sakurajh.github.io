# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Page
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # 升级1：checkout 从 v3 → v4（最新稳定版，无废弃风险）
      - name: Checkout
        uses: actions/checkout@v4
      # 升级2：configure-pages 从 v5 → v6（最新稳定版，适配后续插件）
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # 升级3：jekyll-build-pages 从 v1 → v2（最新稳定版，解决与其他插件的兼容问题）
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v2
        with:
          source: ./
          destination: ./_site
      # 升级4：upload-pages-artifact 从 v2 → v3（最新稳定版，不再依赖废弃的v3 upload-artifact）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 升级5：deploy-pages 从 v2 → v4（最新稳定版，确保部署流程正常）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
