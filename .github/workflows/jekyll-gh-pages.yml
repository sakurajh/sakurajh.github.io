# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      # 修改1：将普通upload-artifact替换为Pages专属upload-pages-artifact@v2
      # 该插件上传的工件，deploy-pages@v4可以直接识别，无需手动下载
      - name: Upload Pages exclusive artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 修改2：删除手动下载artifact的步骤（无需手动下载，deploy-pages会自动获取）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
